[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spherical-hg-flow"
version = "0.1.0"
description = "Conditional Henyey-Greenstein residual spline flows for axisymmetric particle phase functions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.8,<3",
  "zuko==1.6.0",
  "numpy>=2.0,<3",
  "safetensors>=0.5,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "build>=1.2"]

[project.scripts]
phaseflow = "phaseflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: training or native cross-language integration"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
