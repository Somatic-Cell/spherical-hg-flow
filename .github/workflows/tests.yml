name: CPU correctness and legacy native reference

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.12'
            torch: '2.8.0'
            requirements: requirements-validation.txt
          - python: '3.14'
            torch: '2.14.1'
            requirements: requirements-validation-py314.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ${{ matrix.requirements }}
          python -m pip install --no-deps -e .
      - run: ruff check .
      - run: pytest -q
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
      - run: python -m build
